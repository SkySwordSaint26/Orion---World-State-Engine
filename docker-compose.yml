# `docker compose up` (or ./start.sh): Postgres, Redis and the frontend. The backend API runs on the host
# (./start.sh), because extraction (extractor/, backend/app/pipeline/extractor.py) needs the GPU and its own venv.

services:
  db:
    image: postgres:15-alpine
    container_name: orion_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=orion
    ports:
      - "127.0.0.1:5433:5432"          # this machine only: the password is the default one
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orion_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"          # this machine only: no password
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: orion_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://localhost:8000/api/v1   # read by src/api/client.ts; the browser calls it
    volumes:
      - ./Frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
