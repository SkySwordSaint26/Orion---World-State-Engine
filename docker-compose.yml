version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: orion_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=orion
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orion_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orion_backend_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/orion
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=development
      - EXTRACTION_EXECUTOR=celery
      - STORAGE_DIR=/backend/storage
    volumes:
      - ./backend/app:/backend/app
      - backend_storage:/backend/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  backend_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orion_backend_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info -c 2
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/orion
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=development
      - STORAGE_DIR=/backend/storage
    volumes:
      - ./backend/app:/backend/app
      - backend_storage:/backend/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: orion_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      - backend_api

volumes:
  postgres_data:
  redis_data:
  backend_storage:
